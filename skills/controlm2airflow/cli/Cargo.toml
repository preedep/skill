[package]
name = "controlm2airflow"
version = "0.1.0"
edition = "2021"
description = "Convert Control-M job XML exports to Apache Airflow 3.x DAG Python files"
authors = ["Preedee@Digital.Dev"]

[[bin]]
name = "controlm2airflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
minijinja = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
